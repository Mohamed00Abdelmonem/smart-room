<!doctype html>
<html lang="en" dir="ltr" class="light" data-type="product">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='50' fill='%231E1E1E'/><path d='M28 32h14v3.5h-4.5l10.8 33.5h3.4L62.5 35.5H58V32h14v3.5h-4.2L53.5 72h-7L32.2 35.5H28V32z' fill='%23F6F3EE'/></svg>" />
    <link rel="alternate icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VESTA-AI — Spatial Furniture Intelligence & Interior Architecture Platform</title>
    <meta name="description" content="Experience the future of spatial intelligence with VESTA-AI. Visualize, configure, and curate designer furniture flawlessly in your own home." />
    
    <!-- taste-skill Architecture & Page Metadata -->
    <meta name="page-type" content="product" />
    <meta name="site-kind" content="tech" />
    <meta name="category" content="Spatial AI Interior Architecture & Furniture Commerce" />

    <!-- Enforce Instant Scroll to Top & Disable Browser History Scroll Restoration Globally -->
    <script>
      if ('scrollRestoration' in history) {
        history.scrollRestoration = 'manual';
      }
      window.scrollTo(0, 0);
    </script>

    <!-- Theme Initializer: Enforces White-First Light Mode as Default -->
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('vestaia_theme') || localStorage.getItem('roomora_theme');
          if (saved === 'dark') {
            document.documentElement.classList.add('dark');
            document.documentElement.classList.remove('light');
          } else {
            document.documentElement.classList.add('light');
            document.documentElement.classList.remove('dark');
          }
        } catch (e) {
          document.documentElement.classList.add('light');
        }
      })();
    </script>

    <!-- Google Fonts: Playfair Display, Cormorant Garamond, Plus Jakarta Sans, Inter + Alexandria & IBM Plex Sans Arabic -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Alexandria:wght@300;400;500;600;700;800;900&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=Playfair+Display:ital,wght@0,400;0,500;0,600;1,400;1,500&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
